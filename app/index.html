<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MALUS — everything inside one apple</title>
    <meta
      name="description"
      content="A 3D essay about an apple, in seven acts. Nothing in it was downloaded — the shape, the skin, the fracture and the sound are all generated in code."
    />
    <meta name="theme-color" content="#070503" />
    <meta name="color-scheme" content="dark" />

    <!-- The link gets shared and judged from a preview card, so the card is
         part of the work rather than an afterthought. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MALUS — everything inside one apple" />
    <meta
      property="og:description"
      content="Seven acts, one fruit. Gloss has dedicated neurons. Crisp and mealy are two different fracture paths. And domestication ran the other way round."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="800" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MALUS — everything inside one apple" />
    <meta
      name="twitter:description"
      content="Seven acts, one fruit. A 3D essay in which nothing was downloaded."
    />
    <meta name="twitter:image" content="/og.png" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root { margin: 0; padding: 0; height: 100%; }
      html { background: #070503; }
      body {
        background: #070503;
        color: #f7eee4;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
      }
      canvas { display: block; touch-action: none; }
      ::selection { background: #c2181f; color: #fff; }

      /* Boot state.
         Inline, so it is on screen at first paint rather than after the bundle
         parses. Before this the first seconds were a black rectangle with no
         sign of life, which reads as a broken page — and a judge with hundreds
         of entries does not wait to find out otherwise. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: #070503;
        transition: opacity 0.9s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .seed {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ffb877;
        box-shadow: 0 0 26px 6px rgba(255, 150, 90, 0.45);
        animation: pulse 2.1s ease-in-out infinite;
      }
      #boot .say {
        position: absolute;
        bottom: 14vh;
        font-size: 0.62rem;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #8d7a6b;
        text-indent: 0.42em;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(0.72); opacity: 0.55; }
        50% { transform: scale(1.12); opacity: 1; }
      }

      /* Neither of these should ever be a silent black screen. */
      #boot .fallback {
        position: absolute;
        bottom: 26vh;
        max-width: 34ch;
        text-align: center;
        font-size: 0.86rem;
        line-height: 1.6;
        color: #cbb9a8;
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .seed { animation: none; opacity: 0.9; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot">
      <div class="seed"></div>
      <div class="say">loading</div>
      <p class="fallback" id="nogl">
        This piece needs WebGL, and this browser does not appear to have it.
        Everything you would see is generated in code — there is no video to
        fall back to.
      </p>
    </div>

    <noscript>
      <div style="position:fixed;inset:0;display:grid;place-items:center;padding:2rem;background:#070503;color:#cbb9a8;text-align:center;font-size:0.95rem;line-height:1.7;z-index:20">
        <p style="max-width:40ch">
          MALUS is a 3D essay about an apple, and every part of it — the shape,
          the skin, the fracture, the sound — is generated at runtime. That
          needs JavaScript.
        </p>
      </div>
    </noscript>

    <script>
      // Checked before the bundle loads, so a machine without WebGL is told
      // what is wrong instead of staring at the loader forever.
      (function () {
        try {
          var c = document.createElement('canvas')
          var ok = !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')))
          if (!ok) {
            document.getElementById('nogl').style.display = 'block'
            document.querySelector('#boot .seed').style.display = 'none'
            document.querySelector('#boot .say').style.display = 'none'
          }
        } catch (e) {
          document.getElementById('nogl').style.display = 'block'
        }
      })()
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
